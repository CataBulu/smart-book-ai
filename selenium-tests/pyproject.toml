[project]
name = "smartbook-selenium-tests"
version = "0.1.0"
description = "Selenium end-to-end tests for the Smart Book AI front end"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.1.1",
    "selenium>=4.51.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["."]
