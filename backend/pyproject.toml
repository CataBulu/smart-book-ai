[project]
name = "smartbook"
version = "0.1.0"
description = "Smart Book AI - local Qwen RAG chatbot for English book recommendations"
authors = [
    { name = "Catalin", email = "106432849+CataBulu@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "httpx>=0.28.1",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "starlette>=1.7.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
smartbook = "smartbook.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
