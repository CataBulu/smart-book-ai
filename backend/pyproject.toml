[project]
name = "smartbook"
version = "0.1.0"
description = "Smart Book AI - local Qwen RAG chatbot for English book recommendations"
authors = [
    { name = "Catalin", email = "106432849+CataBulu@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "starlette>=1.7.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
smartbook = "smartbook.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
# Local image generation (SD-Turbo) and voice (Kokoro, Whisper). Installed by default; CI skips them because the
# tests run on fakes, and the app hides these features when they're missing.
media = [
    "accelerate>=1.15.0",
    "diffusers>=0.40.0",
    "faster-whisper>=1.2.1",
    "kokoro-onnx>=0.6.1",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[tool.uv]
default-groups = ["dev", "media"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
