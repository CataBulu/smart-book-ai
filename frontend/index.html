<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Book AI</title>
    <meta name="description" content="Smart Book AI — English book recommendations from your own library, powered by local Qwen models." />
    <meta name="theme-color" content="#2563eb" />
    <script>
      // Set the theme before first paint (no light flash, no colour transition on load).
      try {
        var t = localStorage.getItem('smartbook-theme')
        document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
